<style>
:root{--sky:#0284c7;--navy:#0f172a}
*{-webkit-tap-highlight-color:transparent;box-sizing:border-box}
html,body{margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Noto Sans Arabic',Tahoma,Arial,sans-serif;background:#f1f5f9;color:#1e293b;overscroll-behavior-y:none;font-size:14px}
.hidden{display:none!important}
svg.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em}
.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 16px rgba(15,23,42,.06)}
.card.tap:active{background:#f8fafc}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sub{color:#64748b;font-size:12px;margin-top:3px;line-height:1.8}
.btn{border:0;border-radius:12px;font:inherit;font-weight:700;padding:11px 14px;cursor:pointer;transition:.15s;color:#fff;background:var(--sky)}
.btn:active{transform:scale(.97)}
.btn.sl{background:#f1f5f9;color:#1e293b}.btn.em{background:#059669}.btn.am{background:#f59e0b;color:#0f172a}.btn.vi{background:#7c3aed}
.btn.rd{background:transparent;border:1px solid #e11d48;color:#e11d48;padding:3px 10px;font-size:11px;font-weight:600}
.btn.w{width:100%}
.inp{width:100%;background:#f8fafc;border:1px solid #cbd5e1;border-radius:12px;padding:10px 12px;font:inherit;font-size:13px;outline:none;transition:.2s}
.inp:focus{border-color:var(--sky);background:#fff;box-shadow:0 0 0 2px rgba(2,132,199,.15)}
textarea.inp{resize:vertical}
.badge{font-size:10px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-prog{background:#fef3c7;color:#92400e}.b-done{background:#dcfce7;color:#166534}.b-junh{background:#e0e7ff;color:#3730a3}.b-late{background:#ffe4e6;color:#9f1239}.b-gray{background:#f1f5f9;color:#475569}
.hero{background:linear-gradient(135deg,#070e17 0%,#0d1a2d 55%,#0c2a44 100%);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 16px 20px;border-radius:0 0 28px 28px}
.fgxb{flex:none;width:58px;height:58px;border-radius:50%;background:#000;border:3px solid #fbbf24;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:11px;letter-spacing:.3px;box-shadow:0 0 14px rgba(251,191,36,.35)}.fgxb.big{width:104px;height:104px;font-size:19px;border-width:4px}
.hero .in{max-width:540px;margin:auto}
.chipw{font-size:11px;font-weight:600;background:rgba(15,23,42,.8);padding:4px 10px;border-radius:999px;border:1px solid rgba(100,116,139,.5);display:inline-flex;align-items:center;gap:6px;color:#cbd5e1;max-width:60%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:#34d399;flex:none}.dot.o{background:#fbbf24}
.hb{width:34px;height:34px;border-radius:12px;background:rgba(30,41,59,.85);border:0;color:#cbd5e1;display:flex;align-items:center;justify-content:center;font-size:15px}
.hero h1{margin:14px 0 0;font-size:18px;font-weight:900;color:#fbbf24;display:flex;align-items:center;gap:6px}
.hero p{margin:2px 0 0;font-size:12px;font-weight:700}
.lwb{display:inline-block;margin-top:8px;background:#fbbf24;color:#0f172a;font-size:12px;font-weight:800;border-radius:999px;padding:2px 12px}
main{max-width:540px;margin:auto;padding:14px 14px calc(100px + env(safe-area-inset-bottom))}
.tab-bar{position:fixed;bottom:calc(10px + env(safe-area-inset-bottom));left:12px;right:12px;max-width:516px;margin:0 auto;height:64px;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);border:1px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:space-around;border-radius:24px;box-shadow:0 10px 30px rgba(15,23,42,.12);padding:0 6px;z-index:999;transition:transform .3s,opacity .3s}
.tab-bar.hide{transform:translateY(calc(100% + 30px));opacity:0;pointer-events:none}
.tabbtn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:inherit;font-size:11px;font-weight:700;color:#64748b;background:transparent;border:0;cursor:pointer;position:relative}
.tabbtn.on{color:var(--sky)}.tabbtn svg{font-size:18px}.tabbtn.on svg{transform:scale(1.15)}
.tabbtn .bd{position:absolute;top:-4px;right:50%;margin-right:-24px;background:#e11d48;color:#fff;border-radius:99px;font-size:10px;padding:0 5px}
.center{position:relative;top:-14px;width:52px;height:52px;background:linear-gradient(135deg,#0284c7,#0369a1);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 20px rgba(2,132,199,.35);border:2px solid #fff;cursor:pointer;font-size:20px}
.center:active{transform:scale(.94)}
.sheet{position:fixed;inset:0;background:rgba(15,23,42,.55);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);z-index:1100;display:none;align-items:flex-end;justify-content:center;padding:0 10px calc(30px + env(safe-area-inset-bottom))}
.sheet.on{display:flex}
.sheet-inner{background:#fff;width:100%;max-width:540px;border-radius:24px;padding:18px 18px 22px;max-height:calc(100dvh - 90px);overflow-y:auto;box-shadow:0 -8px 30px rgba(15,23,42,.15);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:translateY(0);opacity:1}}
.sheet h3{margin:0 0 4px;font-size:15px;font-weight:800}
.fl{display:block;font-size:12px;font-weight:700;color:#475569;margin-bottom:10px}
.fl .inp{margin-top:4px;font-weight:400}
#detail{position:fixed;inset:0;z-index:50;background:#f1f5f9;overflow-y:auto}
#detail .wrap{max-width:540px;margin:auto;min-height:100%}
.dh{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:#0f172a;color:#fff;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.dh .hb{background:rgba(255,255,255,.1)}
.dh h2{margin:0;font-size:14px;font-weight:900;color:#fbbf24;flex:1}
#d-body{padding:14px 14px 140px}
#d-bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-width:516px;margin:auto;background:rgba(255,255,255,.96);border:1px solid #e2e8f0;border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(15,23,42,.18);display:flex;gap:8px;z-index:60}
.h2{font-size:13px;font-weight:800;color:#0369a1;margin:16px 2px 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed #e2e8f0;font-size:13px}
.kv:last-child{border:0}.kv span:first-child{color:#64748b;white-space:nowrap}.kv span:last-child{text-align:left;word-break:break-word;white-space:pre-wrap;font-weight:600}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:9px 4px;text-align:center;cursor:pointer;box-shadow:0 4px 16px rgba(15,23,42,.05)}
.stat b{display:block;font-size:20px;font-weight:900;color:var(--sky)}.stat span{font-size:11px;color:#64748b;font-weight:700}
.stat.on{border-color:var(--sky);background:#f0f9ff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.chips::-webkit-scrollbar{display:none}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:6px 13px;background:#fff;border:1px solid #e2e8f0;color:#64748b;white-space:nowrap;cursor:pointer}
.chip.on{background:#0f172a;color:#fff;border-color:#0f172a}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tool{text-align:right;border:1px solid #e2e8f0;background:#fff;border-radius:18px;padding:14px;box-shadow:0 4px 16px rgba(15,23,42,.06);font:inherit;cursor:pointer}
.tool .row{margin-bottom:6px}.tool svg{font-size:20px}.tool b{font-size:12.5px;font-weight:800;color:#1e293b}
.note{border-right:4px solid #f59e0b}.note.edit{border-right-color:#2563eb}.note.decision{border-right-color:#059669}.note.payment{border-right-color:#7c3aed}
.note .t{white-space:pre-wrap;line-height:1.9;font-size:13px;margin-top:6px}
.tl{position:relative;padding-right:14px}.tl:before{content:'';position:absolute;right:4px;top:6px;bottom:6px;width:2px;background:#cbd5e1}
.tli{position:relative;padding-bottom:12px;font-size:13px}.tli:before{content:'';position:absolute;right:-14px;top:5px;width:10px;height:10px;border-radius:50%;background:#0284c7;border:2px solid #fff;box-shadow:0 0 0 2px #0284c7}
.empty{text-align:center;color:#94a3b8;padding:30px 10px;line-height:2;font-weight:600}
.toast{position:fixed;bottom:calc(92px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;border:1px solid #fbbf24;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;z-index:2000;max-width:90%;text-align:center}
.dev{display:inline-flex;align-items:center;gap:8px;padding:6px 14px 6px 12px;border-radius:999px;font-size:11px;direction:ltr}
.dev .ic{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;color:#fff;background:linear-gradient(135deg,#0ea5e9,#0369a1)}
.dev .nm{font-weight:800;background:linear-gradient(90deg,#fbbf24,#f59e0b);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.dev.dk{background:rgba(255,255,255,.05);border:1px solid rgba(251,191,36,.25);color:#94a3b8}
.dev.lt{background:#fff;border:1px solid #e2e8f0;color:#64748b}
.dev.lt .nm{background:linear-gradient(90deg,#0369a1,#0284c7);-webkit-background-clip:text;background-clip:text}
#lock{position:fixed;inset:0;z-index:2500;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 50% 28%,rgba(34,211,238,.22) 0,transparent 45%),radial-gradient(circle at 85% 90%,rgba(99,102,241,.22) 0,transparent 50%),repeating-linear-gradient(0deg,rgba(148,163,184,.06) 0 1px,transparent 1px 28px),repeating-linear-gradient(90deg,rgba(148,163,184,.06) 0 1px,transparent 1px 28px),linear-gradient(160deg,#050b14 0%,#0a1830 55%,#060d1a 100%)}
#lock .box{width:100%;max-width:360px;text-align:center;color:#fff}
#lock .roles{display:flex;gap:8px;margin:0 0 14px}#lock .rb{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:transparent;color:#cbd5e1;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer}#lock .rb.on{background:#fbbf24;color:#0f172a;border-color:#fbbf24}
#lock .lg{width:auto;height:auto;border-radius:0;margin:0 auto 16px;background:none;border:0;display:flex;align-items:center;justify-content:center;color:#fbbf24;font-size:28px}
#pin{width:100%;text-align:center;font:inherit;font-size:20px;font-weight:700;letter-spacing:.4em;border-radius:18px;padding:12px 16px;outline:none;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);margin-bottom:14px}

body.unpaid .tab-bar .tabbtn{display:none!important}
</style>

function ds(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return ds(new Date())}
function dAr(d){if(!d)return '—';try{return new Date(String(d).slice(0,10)+'T00:00:00').toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'})}catch(e){return d}}
function cur(){return (S.db&&S.db.settings&&S.db.settings.currency)||'ج.م'}
function money(n){return (Number(n)||0).toLocaleString('ar-EG')+' '+cur()}
function sum(a){return a.reduce(function(s,x){return s+(Number(x)||0)},0)}
function nid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function b64d(s){var b=atob(s),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function kv(l,v){if(v==null||v==='')return '';return '<div class="kv"><span>'+esc(l)+'</span><b>'+v+'</b></div>'}

function layoutTabs(){var admin=canFin();document.querySelectorAll('[data-tab="fin"]').forEach(function(b){b.style.display=admin?'':'none'});
  var nav=document.querySelector('.tab-bar');var it=[].slice.call(nav.querySelectorAll('.tabbtn,.center')).filter(function(b){return b.style.display!=='none'});
  var n=it.length,X=[],Y=[];for(var k=0;k<n;k++){var ang=Math.PI*(n===1?.5:(k/(n-1)))*0.72+Math.PI*0.14;X.push(Math.round(-Math.cos(ang)*155*(n<=4?.9:1)));Y.push(Math.round(-30-Math.sin(ang)*56))}
  it.forEach(function(b,i){b.style.setProperty('--x',X[i]+'px');b.style.setProperty('--y',Y[i]+'px');b.style.transitionDelay=(i*45)+'ms'})}

    h+='</label>'});

  $('#sheetin').innerHTML=h;$('#sheet').classList.add('on');$('#fcancel').onclick=closeSheet;

function mergeInc(inc){var tb=S.db.t=S.db.t||{},it=inc.t||{};Object.keys(it).forEach(function(k){if(!tb[k]||tb[k]<it[k])tb[k]=it[k]});
  COLS.forEach(function(c){var m={};(S.db[c]||[]).forEach(function(r){m[r.id]=r});(inc[c]||[]).forEach(function(r){var l=m[r.id];if(!l||(r._u||0)>(l._u||0))m[r.id]=r});
    S.db[c]=Object.keys(m).map(function(i){return m[i]}).filter(function(r){var t=tb[c+':'+r.id];return !(t&&t>=(r._u||0))})});
  var ch=S.db.charts||{},ic2=inc.charts||{};Object.keys(ic2).forEach(function(p){var l=ch[p];if(!l||(ic2[p]._u||0)>(l._u||0))ch[p]=ic2[p]});S.db.charts=ch;
  if(inc.settings&&(inc.settings._u||0)>((S.db.settings||{})._u||0))S.db.settings=Object.assign({},S.db.settings,inc.settings)}
async function enc(str){var u=new TextEncoder().encode(str);if(window.CompressionStream){var cs=new CompressionStream('gzip'),w=cs.writable.getWriter();w.write(u);w.close();var buf=new Uint8Array(await new Response(cs.readable).arrayBuffer()),s='';for(var i=0;i<buf.length;i++)s+=String.fromCharCode(buf[i]);return 'g1:'+btoa(s)}var s2='';for(var j=0;j<u.length;j++)s2+=String.fromCharCode(u[j]);return 'p1:'+btoa(s2)}
var pushT=null;function push(){clearTimeout(pushT);pushT=setTimeout(doPush,600)}
async function doPush(){if(!CL.cfg||!CL.tok||CL.unpaid||CL.pushing)return;CL.pushing=true;var c=CL.cfg;
  try{for(var at=0;at<3;at++){var g=await cRpc('app_data_get',{p_office:c.id,p_key:c.key,p_token:CL.tok});if(g==null)throw new Error('auth');
      if(g.blob&&g.ver!==c.ver){mergeInc(norm(JSON.parse(await cDec(g.blob))))}
      var r=await cRpc('app_data_put',{p_office:c.id,p_key:c.key,p_token:CL.tok,p_blob:await enc(JSON.stringify(S.db)),p_base:g.ver||0});
      if(r&&r.ok){c.ver=r.ver;await cSave();await saveDb();CL.err='';break}
      if(r&&r.err==='not_allowed'){CL.err='هذا الحساب لا يسمح بالتعديل من التطبيق';break}
      if(at===2)CL.err='تعارض مؤقت، ستُعاد المحاولة'}
  }catch(e){CL.err='تعذر إرسال التعديل — سيُرسَل عند عودة الاتصال';setTimeout(push,30000)}
  finally{CL.pushing=false;render()}}

  var h='<div class="card">'+kv('الموبايل','<span dir="ltr">'+esc(p.phone||'—')+'</span>')+kv('السن',esc(p.age||''))+kv('النوع',esc(p.gender||''))+kv('العنوان',esc(p.address||''))+kv('الحالة',esc(p.status||''))+kv('ملاحظات',esc(p.notes||''))+kv('ملاحظات طبية',esc(p.medicalNotes||''))+(canFin()?kv('إجمالي العلاج',money(sum(tr.map(function(t){return t.cost}))))+kv('المدفوع',money(sum(tr.map(function(t){return t.paid}))))+kv('المتبقي','<span style="color:#e11d48">'+money(due(p.id))+'</span>'):'')+'</div>';
  h+=repCard(p)+payCard(p);
  h+='<div class="card" style="display:grid;gap:8px">'+(p.phone?'<a class="btn" style="text-decoration:none;text-align:center" href="tel:'+esc(p.phone)+'">'+ic('phone')+' اتصال</a><a class="btn em" style="text-decoration:none;text-align:center" target="_blank" rel="noopener" href="https://wa.me/'+waNum(p.phone)+'">واتساب</a>':'')+'<button class="btn sl" data-a="newappt" data-id="'+esc(p.id)+'">'+ic('plus')+' موعد جديد</button>'+(canFin()?'<button class="btn sl" data-a="newpay" data-id="'+esc(p.id)+'">'+ic('coin')+' تسجيل دفعة</button>':'')+'<button class="btn sl" data-a="arch" data-id="'+esc(p.id)+'">'+(p.archived?'استرجاع من الأرشيف':'أرشفة المريض')+'</button></div>';
  h+=sec('المواعيد ('+ap.length+')',ap.slice(0,15).map(function(a){return '<div class="kv" data-a="appt" data-id="'+esc(a.id)+'"><span>'+dAr(a.date)+' '+esc(a.time||'')+' · '+esc(a.type||'')+'</span>'+stBadge(a.status)+'</div>'}).join(''));
  h+=sec('العلاجات ('+tr.length+')',tr.slice(0,20).map(function(t){return '<div class="kv"><span>'+esc(t.proc||'')+(t.tooth?' · سن '+esc(t.tooth):'')+'<br><small style="color:#94a3b8">'+dAr(t.date)+'</small></span><b>'+(canFin()?money(t.paid)+' / '+money(t.cost):esc(t.status||''))+'</b></div>'}).join(''));
  if(canFin())h+=sec('الدفعات ('+pays.length+')',pays.slice(0,20).map(function(x){return '<div class="kv"><span>'+dAr(x.date)+(x.method?' · '+esc(x.method):'')+'</span><b style="color:#16a34a">'+money(x.amount)+'</b></div>'}).join(''));
  return h}
function renderDetail(top){var b=$('#d-body');
  if(top.t==='pat'){var p=pat(top.id);if(!p){history.back();return}$('#d-title').textContent=p.name;b.innerHTML=patBody(p)}}

function newPay(pid){form('تسجيل دفعة — '+pname(pid),[{l:'المبلغ',t:'num'},{l:'طريقة الدفع',t:'select',o:['نقدي','فيزا','تحويل'],v:'نقدي'},{l:'ملاحظات'}],function(v){var amt=+v[0];if(!(amt>0)){toast('اكتب مبلغًا صحيحًا');return}

/* ---- واتساب الحالة + حاسبة الحساب + أرشفة + مريض متكرر ---- */
function waTplSt(a,st){var p=pat(a.patientId)||{},cl=((S.db.settings||{}).clinic)||'العيادة',d=dAr(a.date)+' الساعة '+(a.time||''),hi='مرحباً '+(p.name||'')+'،\n';
  if(st==='ملغي')return hi+'نأسف، تم إلغاء موعدك في '+cl+' بتاريخ '+d+'. يمكنكم التواصل معنا لحجز موعد جديد.';
  if(st==='تمت')return hi+'شكراً لزيارتكم '+cl+'. نتمنى لكم دوام الصحة والعافية.';
  if(st==='قيد الانتظار')return hi+'تم استلام طلب موعدكم في '+cl+' بتاريخ '+d+'، وسيتم تأكيده قريباً.';
  return hi+'تم تأكيد موعدك في '+cl+' بتاريخ '+d+'. بانتظاركم.'}
function stWaForm(a){var p=pat(a.patientId)||{};if(!waNum(p.phone)){closeSheet();return}
  form('رسالة واتساب — '+a.status,[{l:'نص الرسالة',t:'textarea',v:waTplSt(a,a.status)}],function(v){window.open('https://wa.me/'+waNum(p.phone)+'?text='+encodeURIComponent(v[0]),'_blank');closeSheet()},'إرسال عبر واتساب')}

function payCard(p){if(!canFin())return '';var d=due(p.id);if(d<=0)return '';
  return '<div class="card" style="border:1.5px solid #fb7185;background:#fff1f2"><b style="color:#be123c">حاسبة الحساب — لم يسدد بالكامل</b><div class="kv"><span>إجمالي العلاج</span><b>'+money(sum(S.db.treatments.filter(function(t){return t.patientId===p.id}).map(function(t){return +t.cost||0})))+'</b></div><div class="kv"><span>المدفوع</span><b style="color:#16a34a">'+money(sum(S.db.payments.filter(function(x){return x.patientId===p.id}).map(function(x){return +x.amount||0})))+'</b></div><div class="kv"><span>المتبقي</span><b style="color:#e11d48">'+money(d)+'</b></div>'
  +'<input class="inp" id="pfa" inputmode="decimal" placeholder="دفع كام الآن؟" data-id="'+esc(p.id)+'" style="margin-top:8px"><div class="kv"><span>باقي كام بعد الدفع</span><b id="pfr" style="color:#e11d48">'+money(d)+'</b></div>'
  +'<button class="btn em" style="width:100%;margin-top:6px" data-a="pfpay" data-id="'+esc(p.id)+'">تسجيل الدفعة</button>'+(p.phone?'<button class="btn sl" style="width:100%;margin-top:6px" data-a="pfwa" data-id="'+esc(p.id)+'">تذكير بالمتبقي عبر واتساب</button>':'')+'</div>'}
function remMsg(p){return 'مرحباً '+p.name+'،\nتذكير من '+(((S.db.settings||{}).clinic)||'العيادة')+': المتبقي عليكم '+money(due(p.id))+'.\nنرجو التكرم بالسداد. شكراً لكم.'}

  $('#sheetin').innerHTML='<h3>تغيير حالة الموعد — '+esc(p.name||'')+'</h3><div class="sub" style="margin-bottom:10px">'+dAr(a.date)+' '+esc(a.time||'')+' · '+esc(a.type||'')+'</div><div style="display:grid;gap:8px;margin-top:10px">'+L.map(function(x){return '<button class="btn sl" data-a="apst" data-id="'+esc(id)+'" data-v="'+x[0]+'">'+x[1]+(a.status===x[0]?' ✓':'')+'</button>'}).join('')+(role()==='reception'?'<button class="btn sl" data-a="reqedit" data-id="'+esc(id)+'">طلب تعديل الموعد (يحتاج اعتماد)</button>':'')+'<button class="btn sl" id="fcancel">إلغاء</button></div>';$('#sheet').classList.add('on');$('#fcancel').onclick=closeSheet}

async function bkPull(){if(!CL.cfg||!CL.tok||CL.unpaid)return;try{var l=await cRpc('clinic_bk_list',{p_office:CL.cfg.id,p_key:CL.cfg.key,p_token:CL.tok});if(Array.isArray(l)){S.bkq=l}}catch(e){}}
function bkDecide(id,ok){var n=(S.bkq||[]).filter(function(z){return String(z.id)===String(id)})[0];if(!n)return;
  if(ok&&n.kind==='edit'){var ae=S.db.appointments.find(function(z){return z.id===n.apptId});if(ae){mut(function(){ae.date=n.newDate;ae.time=n.newTime;if(n.newStatus)ae.status=n.newStatus;stampRec(ae)});toast('تم اعتماد التعديل')}else toast('الموعد غير موجود');n.status='approved'}
  else if(ok){var p=(n.patientId&&pat(n.patientId))||S.db.patients.filter(function(x){return n.phone&&x.phone===n.phone})[0];
    if(!p){p=stampRec({id:nid('P'),name:n.patientName||'مريض',phone:n.phone||'',age:'',gender:'ذكر',status:'نشط',notes:'',address:'',createdAt:today(),teeth:{},medicalNotes:''});S.db.patients.push(p)}
    var tm=/^\d:\d{2}$/.test(n.time||'')?'0'+n.time:n.time,ap=stampRec({id:nid('A'),patientId:p.id,date:n.date,time:tm,duration:30,type:n.type||'كشف',doctor:n.doctor||(S.db.settings&&S.db.settings.doctor)||'',status:'مؤكد',notes:(n.body||'')+' (حجز من التطبيق)'});
    mut(function(){S.db.appointments.push(ap)});n.status='approved';toast('تم تأكيد الحجز');waConfirm(p.phone,ap)}
  else{if(!confirm('رفض الطلب؟'))return;n.status='rejected'}
  render();cRpc('clinic_bk_set',{p_office:CL.cfg.id,p_key:CL.cfg.key,p_token:CL.tok,p_id:String(id),p_status:ok?'approved':'rejected'}).catch(function(){})}

var TABS=['appts','pat','fin','notes','settings'];
function render(){
  if(CL.unpaid){S.tab='settings';S.stack=[]}
  var top=S.stack[S.stack.length-1];
  $('#detail').classList.toggle('hidden',!top);$('.tab-bar').classList.toggle('hide',!!top);document.body.style.overflow=top?'hidden':'';
  $('#sdot').className='dot'+(S.db&&!CL.err?'':' o');$('#stxt').textContent=CL.err?'غير متصل':S.db?'متصل':'جارٍ التحميل';
  try{var st=(S.db&&S.db.settings)||{},cn=st.clinic||'Fogex',sb=[st.degree,st.doctor].filter(Boolean).join(' - ');
  $('#hr-logo').innerHTML='<div style="display:flex;align-items:center;gap:12px;margin:14px 0 0"><span class="fgxb">FOGEX</span><div style="min-width:0"><div style="font-size:22px;font-weight:300;color:#fff;line-height:1.3">'+esc(cn)+'</div>'+(sb?'<div style="font-size:12px;font-weight:700;color:#e2e8f0;margin-top:2px">'+esc(sb)+'</div>':'')+'</div></div>'}catch(e){}
  $('#lw').innerHTML='<span class="lwb">'+esc(uname())+' — '+({admin:'مدير',doctor:'طبيب',reception:'استقبال'}[role()]||'')+'</span>';
  TABS.forEach(function(t){$('#tab-'+t).classList.toggle('hidden',S.tab!==t)});
  document.querySelectorAll('.tabbtn,.center').forEach(function(b){b.classList.toggle('on',b.dataset.tab===S.tab)});
  if(top){renderDetail(top);return}
  var T=S.tab,el=$('#tab-'+T);
  if(T==='settings'){el.innerHTML=tabSettings();var al=$('#alk');if(al){al.value=String(autoMin());al.onchange=function(){try{localStorage.setItem('fx_autolock',al.value)}catch(e){}toast('تم الحفظ')}}return}
  if(!S.db){el.innerHTML='<div class="card" style="text-align:center;padding:26px 16px"><b style="font-size:16px">جارٍ جلب بيانات العيادة…</b><p style="color:#64748b;font-size:13px">تأكد من الاتصال بالإنترنت ثم اضغط زر التحديث.</p></div>';return}

  else if(T==='notes')el.innerHTML=tabNotes()}

  else if(a==='af'){S.af=id;render()}
